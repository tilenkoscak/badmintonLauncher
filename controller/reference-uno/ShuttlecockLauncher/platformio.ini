; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    waspinator/AccelStepper@^1.64
    arduino-libraries/Servo
monitor_port = COM4
monitor_speed = 9600

; ============================================================
; Only one sketch with setup()/loop() can be built at a time.
; Default [env:uno]: pan stepper test. For servo wiring test, use env uno_servo_test
; (PIO: project environment switcher) or point build_src_filter at servo_test.cpp.
; ============================================================
build_src_filter = +<pan_stepper_test.cpp> -<main.cpp> -<servo_test.cpp>

[env:uno_servo_test]
extends = env:uno
build_src_filter = +<servo_test.cpp> -<main.cpp> -<pan_stepper_test.cpp>

[env:uno_io_scan_test]
extends = env:uno
build_src_filter = +<io_pin_scan_test.cpp> -<main.cpp> -<pan_stepper_test.cpp> -<servo_test.cpp>
